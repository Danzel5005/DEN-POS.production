<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP: tidak ada 'unsafe-eval' -> menghilangkan Electron Security Warning.
         'unsafe-inline' untuk style wajib (app inject <style> + style attr).
         'unsafe-inline' untuk script hanya dipakai Vite dev (react-refresh preamble);
         build produksi tidak punya inline script. data: untuk logo base64,
         ws://localhost:5173 untuk HMR websocket di dev. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:5173 http://localhost:5173" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>DEN POS — Kasir</title>
    <style>
      :root {
        --color-primary: #1a5c38;
        --color-primary-dark: #0f3d24;
        --color-primary-light: #e8f5ee;
        --color-secondary: #e87c2a;
        --color-secondary-light: #fff8e0;
        --color-danger: #d32f2f;
        --color-info: #1a5fb4;
        --color-bg: #0f0e0c;
        --color-surface: #ffffff;
        --color-surface-alt: #f5f5f0;
        --color-border: #e0e0d8;
        --color-text-primary: #1a1a1a;
        --color-text-muted: #888888;
        --radius-none: 0px;
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-full: 9999px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: var(--color-bg); font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
