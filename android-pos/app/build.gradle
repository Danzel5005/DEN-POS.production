plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def webAssets = layout.buildDirectory.dir("generated/assets/www")

android {
    namespace 'com.denpos.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.denpos.mobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.4.0"
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir("generated/assets"))
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

tasks.register('buildWebApp', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'cmd', '/c', 'npm run build'
}

tasks.register('copyWebAssets', Sync) {
    dependsOn 'buildWebApp'
    from(rootProject.projectDir.parentFile.toPath().resolve('dist').toFile())
    into(webAssets)
}

// App icon — salin PNG dari folder DenPosIcons (sumber ikon bersama dengan web)
// ke res mipmap, jadi launcher memakai logo DEN POS tanpa duplikasi file.
def iconSizes = ["mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192]
iconSizes.each { resName, size ->
    def target = file("src/main/res/${resName}")
    tasks.register("copyIcon${resName}", Copy) {
        from(rootProject.projectDir.parentFile.toPath().resolve('DenPosIcons').resolve("android-chrome-${size}x${size}.png"))
        into(target)
        rename { 'ic_launcher.png' }
    }
}
tasks.matching { it.name.startsWith('copyIcon') }.configureEach {
    tasks.named('preBuild').configure { dependsOn it }
}

tasks.named('preBuild').configure {
    dependsOn 'copyWebAssets'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
